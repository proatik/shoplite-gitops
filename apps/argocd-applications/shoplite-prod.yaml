apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: default
  sources:
    - repoURL: git@github.com:proatik/shoplite-app.git
      targetRevision: main
      path: helm/shoplite
      helm:
        valueFiles: [$values/envs/prod/values.yaml]
    - repoURL: git@github.com:proatik/shoplite-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: shoplite
  # prod changes only when someone syncs it in argo cd, after checking dev.
