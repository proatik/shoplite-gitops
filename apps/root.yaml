# the one Application bootstrap.sh applies; it creates every Application in apps/argocd-applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:proatik/shoplite-gitops.git
    targetRevision: main
    path: apps/argocd-applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
