# traefik behind the alb: prod on the web entrypoint, dev on its own, each a fixed NodePort the alb targets.
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    expose:
      default: false
  dev:
    port: 8081
    exposedPort: 8081
    nodePort: 30081
    protocol: TCP
    expose:
      default: true
# a NodePort service has no address to copy, so bootstrap.sh hands traefik the alb's dns name to
# report on every ingress; without an address argo cd keeps an ingress Progressing.
providers:
  kubernetesIngress:
    publishedService:
      enabled: false
ingressClass:
  isDefaultClass: true
# the alb health check calls /ping on the prod NodePort, so ping answers on the web entrypoint.
additionalArguments:
  - --ping.entrypoint=web
deployment:
  healthchecksPort: 8000
