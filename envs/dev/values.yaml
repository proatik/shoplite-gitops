# shoplite-dev: argo cd syncs every change here on its own.
# ci writes image after each release on shoplite-app main; until the first one, the pods wait for it.
image:
  registry: '841162696561.dkr.ecr.ap-southeast-1.amazonaws.com'
  tag: "301a7f6"
# dev answers on the alb's port 8080, through traefik's dev entrypoint.
ingress:
  entryPoint: dev
monitoring:
  enabled: true
# catalog-api releases go through an analysed canary (argo rollouts).
catalogApi:
  canary:
    enabled: true
# dev shows the bonus queue: orders go through amazon sqs, and a lambda emits OrderConfirmed.
# prod keeps the redis list orders:pending that the brief requires.
queue:
  backend: sqs
  awsRegion: ap-southeast-1
